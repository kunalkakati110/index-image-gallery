<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }

       
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 18px;
            border: none;
            background-color: #fff;
            color: #555;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #3498db;
            color: #fff;
            transform: translateY(-2px);
        }

     
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            aspect-ratio: 4 / 3;
            background-color: #ddd;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

      
        .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            padding: 15px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .gallery-item.hide {
            display: none;
        }

       
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 85%;
            max-height: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.4s ease;
        }

        .lightbox.active .lightbox-img {
            transform: scale(1);
        }

        .lightbox-caption {
            color: #fff;
            margin-top: 15px;
            font-size: 1.1rem;
            text-align: center;
        }

        
        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            font-size: 24px;
            padding: 12px 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.3s;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .prev-btn { left: -60px; }
        .next-btn { right: -60px; }

       
        @media (max-width: 768px) {
            .nav-btn {
                padding: 8px 12px;
                font-size: 18px;
            }
            .prev-btn { left: -40px; }
            .next-btn { right: -40px; }
        }
    </style>
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="architecture">Architecture</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
    </div>

    <div class="gallery-grid">
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/10/800/600" alt="Mountain Lake">
            <div class="item-overlay"><h3>Mountain Lake</h3></div>
        </div>
        <div class="gallery-item" data-category="architecture">
            <img src="https://picsum.photos/id/1011/800/600" alt="Modern Building">
            <div class="item-overlay"><h3>Modern Building</h3></div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/1025/800/600" alt="Pug Puppy">
            <div class="item-overlay"><h3>Pug Puppy</h3></div>
        </div>
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/28/800/600" alt="Forest Path">
            <div class="item-overlay"><h3>Forest Path</h3></div>
        </div>
        <div class="gallery-item" data-category="architecture">
            <img src="https://picsum.photos/id/1048/800/600" alt="Classic Facade">
            <div class="item-overlay"><h3>Classic Facade</h3></div>
        </div>
        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/1062/800/600" alt="Wild Butterfly">
            <div class="item-overlay"><h3>Wild Butterfly</h3></div>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
            <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
            <img src="" alt="" class="lightbox-img" id="lightboxImg">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <script>
        
        const galleryItems = document.querySelectorAll('.gallery-item');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentIndex = 0;
       
        let visibleItems = [...galleryItems]; 

        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
               
                document.querySelector('.filter-btn.active').classList.remove('active');
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');
                
                
                galleryItems.forEach(item => {
                    if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                        item.classList.remove('hide');
                    } else {
                        item.classList.add('hide');
                    }
                });

                
                visibleItems = Array.from(galleryItems).filter(item => !item.classList.contains('hide'));
            });
        });

        
        function showLightbox(index) {
            currentIndex = index;
            const item = visibleItems[currentIndex];
            const imgTarget = item.querySelector('img');
            const titleTarget = item.querySelector('.item-overlay h3');

            lightboxImg.src = imgTarget.src;
            lightboxImg.alt = imgTarget.alt;
            lightboxCaption.textContent = titleTarget.textContent;
            
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function navigateLightbox(direction) {
            currentIndex += direction;
            if (currentIndex >= visibleItems.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = visibleItems.length - 1;
            
            showLightbox(currentIndex);
        }

    
        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                const index = visibleItems.indexOf(item);
                if (index !== -1) showLightbox(index);
            });
        });

        
        closeBtn.addEventListener('click', closeLightbox);
        nextBtn.addEventListener('click', () => navigateLightbox(1));
        prevBtn.addEventListener('click', () => navigateLightbox(-1));

        
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') navigateLightbox(1);
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
        });
    </script>
</body>
</html>
